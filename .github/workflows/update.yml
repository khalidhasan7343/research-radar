# Twice-weekly refresh: fetch new papers for every tracked venue + arXiv, re-run
# the analysis, commit the updated reports, and open an issue with "what's new"
# whenever new papers arrived (GitHub emails you about it).
#
# The paper database is NOT committed. It contains abstracts owned by their
# authors and publishers, so it lives in the Actions cache (readable only by
# workflows in this repository) between runs. Only reports/CHANGES.md,
# reports/TREND_REPORT.md, reports/TREND_REPORT.html and reports/changes.json
# are committed.
#
# GitHub deletes caches that have not been used for 7 days. The job runs twice
# a week to keep the cache alive. If the cache is lost anyway, the job rebuilds
# the database from the repository variables RADAR_VENUES and RADAR_YEARS
# (and RADAR_SOURCES / RADAR_ARXIV if set).
#
# First run: Actions tab -> "Research Radar update" -> Run workflow, and fill
# in the venues/years to start from (or set the repository variables above).

name: Research Radar update

on:
  schedule:
    - cron: "17 3 * * 1,4"   # Mondays and Thursdays 03:17 UTC
  workflow_dispatch:
    inputs:
      venues:
        description: "Venues to start tracking (only needed the first time), e.g. neurips,icml,iclr,cvpr,acl"
        default: ""
      years:
        description: "Years to backfill for those venues, e.g. 2023-2025"
        default: ""
      sources:
        description: "Sources: openalex, s2, openreview"
        default: "s2,openalex"
      arxiv:
        description: "arXiv categories to follow (optional), e.g. cs.LG,cs.CL,cs.CV"
        default: ""
      force:
        description: "Re-analyse even if nothing new arrived"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RADAR_CONTACT_EMAIL: ${{ vars.RADAR_CONTACT_EMAIL }}
      RADAR_S2_API_KEY: ${{ secrets.RADAR_S2_API_KEY }}
      RADAR_EMBED_BACKEND: ${{ vars.RADAR_EMBED_BACKEND || 'tfidf' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # data/ holds the database, embeddings and the HTTP response cache.
      - name: Restore data from the Actions cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}
          restore-keys: radar-data-

      - name: Check for an existing database
        id: db
        run: |
          if [ -f data/radar.db ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Backfill (manual runs with venues given)
        if: ${{ github.event.inputs.venues != '' && github.event.inputs.years != '' }}
        run: radar ingest venues --venues "${{ github.event.inputs.venues }}" --years "${{ github.event.inputs.years }}" --sources "${{ github.event.inputs.sources }}"

      - name: Rebuild from repository variables (no cached database)
        if: ${{ steps.db.outputs.exists != 'true' && github.event.inputs.venues == '' && vars.RADAR_VENUES != '' && vars.RADAR_YEARS != '' }}
        run: radar ingest venues --venues "${{ vars.RADAR_VENUES }}" --years "${{ vars.RADAR_YEARS }}" --sources "${{ vars.RADAR_SOURCES || 's2,openalex' }}"

      - name: Follow arXiv (manual runs)
        if: ${{ github.event.inputs.arxiv != '' }}
        run: radar track --arxiv "${{ github.event.inputs.arxiv }}"

      - name: Follow arXiv (repository variable, no cached database)
        if: ${{ steps.db.outputs.exists != 'true' && github.event.inputs.arxiv == '' && vars.RADAR_ARXIV != '' }}
        run: radar track --arxiv "${{ vars.RADAR_ARXIV }}"

      - name: Check that something is tracked
        id: track
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          from radar.config import load_settings
          from radar.db import DB
          from radar.ingest import get_tracking
          t = get_tracking(DB(load_settings().db_path))
          print("ready=" + ("true" if t["venues"] or t.get("arxiv") else "false"))
          EOF
          if grep -q "ready=false" "$GITHUB_OUTPUT"; then
            echo "::warning title=Nothing tracked yet::Run this workflow manually with venues and years filled in, or set the repository variables RADAR_VENUES and RADAR_YEARS (e.g. neurips,icml,iclr and 2023-2025). Skipping this run."
          fi

      - name: Update and analyse
        if: ${{ steps.track.outputs.ready == 'true' }}
        run: |
          set -o pipefail
          radar update ${{ github.event.inputs.force == 'true' && '--force' || '' }} | tee update.log
          radar report

      - name: Save data to the Actions cache
        if: ${{ always() && hashFiles('data/radar.db') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}

      - name: Commit reports
        id: commit
        if: ${{ steps.track.outputs.ready == 'true' }}
        run: |
          git config user.name "research-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/CHANGES.md reports/TREND_REPORT.md reports/TREND_REPORT.html reports/changes.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Research Radar update $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          ch = json.load(open("reports/changes.json"))
          print("new=" + str(ch.get("n_new_papers", 0)))
          EOF

      - name: Open an issue with what's new
        if: ${{ steps.track.outputs.ready == 'true' && steps.commit.outputs.new != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Research Radar: what's new ($(date -u +%Y-%m-%d))" --body-file reports/CHANGES.md

      - name: Keep the trend report as a downloadable artifact
        if: ${{ steps.track.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: reports/
