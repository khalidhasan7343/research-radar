[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-radar"
version = "1.0.0"
description = "Map a research field from conference papers and find evidence-backed research directions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MD Khalid Hasan" }]
requires-python = ">=3.11"
keywords = ["research", "bibliometrics", "topic-modeling", "trend-analysis", "machine-learning", "openalex", "arxiv"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4", "scipy>=1.11",
  "requests>=2.31", "fastapi>=0.110", "uvicorn>=0.27", "joblib>=1.3",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.3"]            # better embeddings, CPU/ONNX, ~130 MB model
sbert = ["sentence-transformers>=3"]     # any SentenceTransformer model (pulls torch)
umap = ["umap-learn>=0.5"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/khalidhasan7343/research-radar"
Issues = "https://github.com/khalidhasan7343/research-radar/issues"

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["web/*"]
